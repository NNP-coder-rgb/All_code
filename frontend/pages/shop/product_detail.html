<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đang Tải Chi Tiết Sản Phẩm | HYBRID.STORE</title>
    <script src="../../js/mock_data.js"></script>
    <script src="../../js/product-detail-data.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        var p = ProductDetailData.resolveProduct(id);
        if (p && p.type === "c2c") {
          window.location.replace("product_used.html" + window.location.search);
        } else {
          window.location.replace("product_new.html" + window.location.search);
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #0b0f19;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: system-ui, sans-serif;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #94a3b8;">Đang tải chi tiết sản phẩm...</p>
    </div>
  </body>
</html>
