    <rect x="8" y="8" width="124" height="244" rx="20" fill="#09090b" />
    <!-- Dynamic Island -->
    <rect x="46" y="16" width="48" height="12" rx="6" fill="#000" />
    <!-- Camera module glow -->
    <circle cx="70" cy="130" r="32" fill="#8b5cf6" opacity="0.15" />
    <circle cx="70" cy="130" r="14" fill="none" stroke="#22d3ee" stroke-width="2" />
