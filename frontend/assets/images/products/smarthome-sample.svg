<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181829" />
      <stop offset="100%" stop-color="#0f0f1b" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#iotBg)" />
  <rect x="20" y="20" width="130" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <text x="85" y="38" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">SMART LIVING IOT</text>
  <!-- Smart Speaker / Hub -->
  <g transform="translate(130, 110)">
    <rect x="0" y="30" width="140" height="150" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <!-- Speaker Grille Lines -->
    <line x1="20" y1="80" x2="120" y2="80" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="100" x2="120" y2="100" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="120" x2="120" y2="120" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="140" x2="120" y2="140" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <!-- Light Ring on Top -->
    <ellipse cx="70" cy="30" rx="55" ry="14" fill="#0f172a" stroke="#10b981" stroke-width="4" />
    <circle cx="70" cy="30" r="10" fill="#06b6d4" />
  </g>
</svg>
