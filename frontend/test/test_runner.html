<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm Thử Tự Động utils.js &amp; Catalog | HYBRID.STORE</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <style>
      body {
        padding: 40px 20px;
      }
      .test-container {
        max-width: 900px;
        margin: 0 auto;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 32px;
      }
      .test-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        font-size: var(--fs-sm);
      }
      .test-row:last-child {
        border-bottom: none;
      }
      .test-pass {
        color: var(--success);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .test-fail {
        color: var(--danger);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .summary-box {
        display: flex;
        gap: 16px;
        margin-top: 24px;
        padding: 16px;
        background: var(--neutral-800);
        border-radius: var(--radius-md);
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
        <div>
          <h2 style="font-family: var(--font-head); color: var(--text);">Hệ Thống Kiểm Thử Tự Động — utils.js</h2>
          <p class="text-sm text-muted mt-1">Đánh giá tiêu chí chấp nhận: Catalog lọc, sắp xếp, phân trang trên dữ liệu giả</p>
        </div>
        <div style="display:flex; gap: 8px;">
          <a href="../pages/shop/catalog.html" class="btn btn-primary btn-sm">
            <span class="material-symbols-outlined icon-sm">storefront</span> Đến Trang Catalog
          </a>
          <a href="../index.html" class="btn btn-outlined btn-sm">
            <span class="material-symbols-outlined icon-sm">home</span> Trang Chủ
          </a>
        </div>
      </div>

      <div id="testOutput"></div>

      <div class="summary-box">
        <div><strong>Tổng kiểm thử:</strong> <span id="totalTests">0</span></div>
        <div style="color:var(--success);"><strong>Thành công:</strong> <span id="passedTests">0</span></div>
        <div style="color:var(--danger);"><strong>Thất bại:</strong> <span id="failedTests">0</span></div>
      </div>

      <div class="mt-4" style="display:flex; gap: 12px;">
        <button type="button" class="btn btn-secondary btn-sm" id="btnTestToast">
          <span class="material-symbols-outlined icon-sm">notifications</span> Thử hàm toast()
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnTestConfirm">
          <span class="material-symbols-outlined icon-sm">help</span> Thử hàm confirm()
        </button>
      </div>
    </div>

    <!-- Scripts cần nạp -->
    <script src="../js/popup.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/mock_data.js"></script>
    <script src="../js/utils.js"></script>

    <script>
      const output = document.getElementById("testOutput");
      let total = 0, passed = 0, failed = 0;

      function test(name, fn) {
        total++;
        const row = document.createElement("div");
        row.className = "test-row";
        try {
          fn();
          passed++;
          row.innerHTML = '<span>' + name + '</span><span class="test-pass"><span class="material-symbols-outlined icon-sm">check_circle</span> PASS</span>';
        } catch (e) {
          failed++;
          row.innerHTML = '<span>' + name + '</span><span class="test-fail"><span class="material-symbols-outlined icon-sm">cancel</span> FAIL: ' + e.message + '</span>';
        }
        output.appendChild(row);
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message || "Assertion failed");
      }

      // 1. formatCurrency
      test("1. formatCurrency(2850000) === '2.850.000₫'", () => {
        assert(Utils.formatCurrency(2850000) === "2.850.000₫");
      });
      test("2. formatCurrency(0) và formatCurrency(null) === '0₫'", () => {
        assert(Utils.formatCurrency(0) === "0₫");
        assert(Utils.formatCurrency(null) === "0₫");
      });

      // 2. formatDate
      test("3. formatDate(date) định dạng chuẩn DD/MM/YYYY", () => {
        const d = new Date(2026, 10, 9, 14, 30);
        assert(Utils.formatDate(d) === "09/11/2026");
      });
      test("4. formatDate(date, 'DD/MM/YYYY HH:mm') định dạng kèm giờ", () => {
        const d = new Date(2026, 10, 9, 14, 30);
        assert(Utils.formatDate(d, "DD/MM/YYYY HH:mm") === "09/11/2026 14:30");
      });

      // 3. renderStars
      test("5. renderStars(5) === '★★★★★' (5 sao đầy)", () => {
        assert(Utils.renderStars(5) === "★★★★★");
      });
      test("6. renderStars(4.5) === '★★★★½' (4 sao đầy, 1 nửa)", () => {
        assert(Utils.renderStars(4.5) === "★★★★½");
      });
      test("7. renderStars(3.5) === '★★★½☆' (3 đầy, 1 nửa, 1 rỗng)", () => {
        assert(Utils.renderStars(3.5) === "★★★½☆");
      });
      test("8. renderStars(0) === '☆☆☆☆☆' (5 sao rỗng)", () => {
        assert(Utils.renderStars(0) === "☆☆☆☆☆");
      });
      test("9. renderStars.toHTML(4.8) sinh HTML có class rating và sao Material Symbols", () => {
        const html = Utils.renderStars.toHTML(4.8);
        assert(html.includes("rating") && html.includes("star_half"));
      });

      // 4. filterProducts
      test("10. filterProducts lọc đúng theo ngành hàng category", () => {
        const res = Utils.filterProducts(PRODUCTS, { category: "fashion" });
        assert(res.length > 0 && res.every(p => p.category === "fashion"));
      });
      test("11. filterProducts lọc đúng theo loại hàng type ('mall')", () => {
        const res = Utils.filterProducts(PRODUCTS, { type: "mall" });
        assert(res.length > 0 && res.every(p => p.type === "mall"));
      });
      test("12. filterProducts lọc đúng theo khoảng giá minPrice - maxPrice", () => {
        const min = 3000000, max = 10000000;
        const res = Utils.filterProducts(PRODUCTS, { minPrice: min, maxPrice: max });
        assert(res.length > 0 && res.every(p => p.price >= min && p.price <= max));
      });
      test("13. filterProducts lọc đa điều kiện đồng thời (category + type + minPrice + keyword)", () => {
        const res = Utils.filterProducts(PRODUCTS, {
          category: "tech",
          type: "mall",
          minPrice: 1000000,
          keyword: "bàn phím"
        });
        assert(res.length > 0 && res[0].name.toLowerCase().includes("bàn phím"));
      });

      // 5. sortProducts
      test("14. sortProducts('price-asc') sắp xếp giá tăng dần", () => {
        const res = Utils.sortProducts(PRODUCTS, "price-asc");
        for (let i = 0; i < res.length - 1; i++) {
          assert(res[i].price <= res[i + 1].price);
        }
      });
      test("15. sortProducts('price-desc') sắp xếp giá giảm dần", () => {
        const res = Utils.sortProducts(PRODUCTS, "price-desc");
        for (let i = 0; i < res.length - 1; i++) {
          assert(res[i].price >= res[i + 1].price);
        }
      });
      test("16. sortProducts('rating-desc') sắp xếp điểm đánh giá cao nhất", () => {
        const res = Utils.sortProducts(PRODUCTS, "rating-desc");
        for (let i = 0; i < res.length - 1; i++) {
          assert((res[i].rating || 0) >= (res[i + 1].rating || 0));
        }
      });
      test("17. sortProducts('name-asc') sắp xếp tên A-Z tiếng Việt", () => {
        const res = Utils.sortProducts(PRODUCTS, "name-asc");
        for (let i = 0; i < res.length - 1; i++) {
          assert(res[i].name.localeCompare(res[i + 1].name, "vi") <= 0);
        }
      });

      // 6. paginate
      test("18. paginate trả cấu trúc { items, page, totalPages, total }", () => {
        const res = Utils.paginate(PRODUCTS, 1, 8);
        assert(res.total === PRODUCTS.length);
        assert(res.totalPages === Math.ceil(PRODUCTS.length / 8));
        assert(res.page === 1);
        assert(res.items.length === 8);
      });
      test("19. paginate trang 2 trả đúng 8 sản phẩm tiếp theo", () => {
        const res = Utils.paginate(PRODUCTS, 2, 8);
        assert(res.page === 2);
        assert(res.items[0].id === PRODUCTS[8].id);
      });
      test("20. paginate clamp số trang vượt giới hạn", () => {
        const res = Utils.paginate(PRODUCTS, 999, 8);
        assert(res.page === res.totalPages);
      });

      // 7. startCountdown
      test("21. startCountdown khởi tạo controller và trả getRemaining()", () => {
        const ctrl = Utils.startCountdown(10, null, () => {});
        assert(typeof ctrl.stop === "function");
        assert(ctrl.getRemaining() <= 10 && ctrl.getRemaining() > 0);
        ctrl.stop();
      });

      // 8. getUsedDiscountPercent
      test("22. getUsedDiscountPercent tính đúng tỷ lệ rẻ hơn của đồ cũ so với đồ mới", () => {
        const pct = Utils.getUsedDiscountPercent(21990000, 29990000);
        assert(pct === 27);
      });

      // 9. Validator (T12)
      test("23. Validator kiểm tra email và số điện thoại chuẩn xác", () => {
        assert(Utils.Validator.isEmail("khachhang@gmail.com") === true);
        assert(Utils.Validator.isEmail("invalid-email") === false);
        assert(Utils.Validator.isPhone("0912345678") === true);
        assert(Utils.Validator.isPhone("123") === false);
      });

      // 10. Cart (T12)
      test("24. Cart.addItem thêm sản phẩm, cập nhật số lượng và tính tổng tiền", () => {
        Utils.Cart.clear();
        assert(Utils.Cart.getCount() === 0);
        Utils.Cart.addItem(PRODUCTS[0], 2);
        assert(Utils.Cart.getCount() === 2);
        assert(Utils.Cart.getSubtotal() === PRODUCTS[0].price * 2);
        Utils.Cart.clear();
        assert(Utils.Cart.getCount() === 0);
      });

      // 11. Auth (T12)
      test("25. Auth mockLogin lưu phiên đăng nhập và switchRole hoạt động đúng", () => {
        const res = Utils.Auth.mockLogin("phuc.nn@gmail.com", "pass123", "buyer");
        assert(res.success === true);
        assert(Utils.Auth.isAuthenticated() === true);
        assert(Utils.Auth.getCurrentUser().role === "buyer");
        Utils.Auth.switchRole("seller");
        assert(Utils.Auth.getCurrentUser().role === "seller");
        Utils.Auth.mockLogout();
      });

      // 12. Offer (T12)
      test("26. Offer submitOffer lưu đề xuất trả giá và tính đúng % giảm", () => {
        const res = Utils.Offer.submitOffer({
          productId: "t1",
          originalPrice: 20000000,
          offerPrice: 16000000,
          message: "Deal nhanh 16tr",
          buyerName: "Nguyễn Ngọc Phúc"
        });
        assert(res.success === true);
        assert(res.offer.discountPercent === 20);
        const offers = Utils.Offer.getOffers("t1");
        assert(offers.length > 0);
      });

      // 13. Mock Data T10
      test("27. MOCK_USERS, MOCK_ESCROW, MOCK_DISPUTES sẵn sàng trong mock_data.js", () => {
        assert(Array.isArray(MOCK_USERS) && MOCK_USERS.length >= 4);
        assert(MOCK_ESCROW && MOCK_ESCROW.summary.totalTvl > 0);
        assert(Array.isArray(MOCK_DISPUTES) && MOCK_DISPUTES.length > 0);
      });

      document.getElementById("totalTests").textContent = total;
      document.getElementById("passedTests").textContent = passed;
      document.getElementById("failedTests").textContent = failed;

      // Nút thử toast & confirm
      document.getElementById("btnTestToast").addEventListener("click", () => {
        Utils.toast("Thông báo thử nghiệm từ utils.js thành công!", "success");
      });
      document.getElementById("btnTestConfirm").addEventListener("click", () => {
        Utils.confirm("Bạn có muốn mở trang Catalog ngay bây giờ không?", () => {
          window.location.href = "../pages/shop/catalog.html";
        });
      });
    </script>
  </body>
</html>
